baseURL = 'https://harushuura.vip'
title = '春天与阿修罗'
theme = 'rusty-typewriter'
hasCJKLanguage = true

# Hugo ≥ 0.158 用 locale 取代 languageCode；本地和 Vercel 都需要 ≥ 0.158
locale = 'zh'
DefaultContentLanguage = 'zh'

# 页脚版权文字（layouts/partials/footer.html 读取 site.Copyright）
copyright = "春天与阿修罗 谢绝无断转载分发 since01/03/2024"

[markup]
[markup.highlight]
codeFences = true
guessSyntax = false
hl_Lines = ""
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = true
style = "perldoc"
tabWidth = 4

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
subtitle = "食宇宙尘埃·或吐纳着空气和盐水"

# imgloop 短代码开关
enableimgloop = true

[params.author]
name = "春天与阿修罗"

[params.links]
theme = "https://github.com/math-queiroz/rusty-typewriter"
hugo = "https://gohugo.io"

# 覆盖主题默认值（主题的其余默认见 themes/rusty-typewriter/hugo.toml）
[params.rtwt.home]
showAuthorImg = false

# 生成搜索索引 /searchindex.json（主题的搜索页靠它工作）
[outputFormats]
[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "SearchIndex"]

[[menus.main]]
name = '博文'
pageRef = '/post'
weight = 1
